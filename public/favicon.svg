<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Hermes Agent">
  <defs>
    <!-- Lighter, richer dark background container for better contrast -->
    <linearGradient id="ha-bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E243D" />
      <stop offset="100%" stop-color="#0B0F1E" />
    </linearGradient>

    <!-- Brighter cyan to indigo -->
    <linearGradient id="ha-left" x1="28" y1="16" x2="28" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Brighter pink to purple -->
    <linearGradient id="ha-right" x1="68" y1="16" x2="68" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9A8D4" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Brighter center beam -->
    <linearGradient id="ha-center" x1="28" y1="48" x2="68" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <filter id="ha-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
    </filter>
    <filter id="ha-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
    </filter>
  </defs>

  <!-- Background container - increased stroke opacity for visibility -->
  <rect width="96" height="96" rx="22" fill="url(#ha-bg)" />
  <rect x="1" y="1" width="94" height="94" rx="21" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- The Neural Constellation -->
  <g>
    <!-- Glow passes to make the shape pop off the background without using mix-blend-mode -->
    <path d="M 28 16 Q 28 48 38 48 Q 28 48 28 80 Q 28 48 18 48 Q 28 48 28 16 Z" fill="url(#ha-left)" filter="url(#ha-glow)" opacity="0.75" />
    <path d="M 68 16 Q 68 48 78 48 Q 68 48 68 80 Q 68 48 58 48 Q 68 48 68 16 Z" fill="url(#ha-right)" filter="url(#ha-glow)" opacity="0.75" />

    <!-- Core solid shapes -->
    <path d="M 28 16 Q 28 48 38 48 Q 28 48 28 80 Q 28 48 18 48 Q 28 48 28 16 Z" fill="url(#ha-left)" />
    <path d="M 68 16 Q 68 48 78 48 Q 68 48 68 80 Q 68 48 58 48 Q 68 48 68 16 Z" fill="url(#ha-right)" />
    <path d="M 28 48 Q 48 48 48 34 Q 48 48 68 48 Q 48 48 48 62 Q 48 48 28 48 Z" fill="url(#ha-center)" />
  </g>

  <!-- Increased Core Highlight for improved visibility -->
  <path d="M 38 48 Q 48 48 48 42 Q 48 48 58 48 Q 48 48 48 54 Q 48 48 38 48 Z" fill="#FFFFFF" />
  <circle cx="48" cy="48" r="2.5" fill="#FFFFFF" filter="url(#ha-glow)" />
  
  <!-- Brighter Peripheral AI Sparkles (Pure White) -->
  <path d="M 76 24 Q 79 24 79 21 Q 79 24 82 24 Q 79 24 79 27 Q 79 24 76 24 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M 14 74 Q 17 74 17 71 Q 17 74 20 74 Q 17 74 17 77 Q 17 74 14 74 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
